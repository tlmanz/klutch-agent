name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wails build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        env:
          CGO_ENABLED: '1'
        run: go vet -tags webkit2_41 ./...
      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test -tags webkit2_41 ./... -race
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build -tags webkit2_41 -o /dev/null .
