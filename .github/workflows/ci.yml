name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install Fyne build deps
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libxxf86vm-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        env:
          CGO_ENABLED: '1'
        run: go vet ./...
      - name: Test
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race
      - name: Build
        env:
          CGO_ENABLED: '1'
        run: go build -o /dev/null .
